# Keep integration-test fixtures out of the developer's normal workspace database.
# SingleConnectionDataSource preserves this in-memory database for each Spring test context.
spring.datasource.url=jdbc:sqlite::memory:
# Spring test contexts are cached across classes. Connector tests leave CONNECTED records whose
# WireMock servers are gone by the first five-minute tick, so background polling must stay off.
connectors.polling.enabled=false
# Tests exercise plugin lifecycle explicitly and must never launch optional native processes.
plugins.auto-start-enabled=false
