server:
  port: 8080
  address: 127.0.0.1   # trusted internal network only — no auth until Phase 6 (plan.md §1)

spring:
  application:
    name: mcp-server
  datasource:
    url: jdbc:sqlite:./data/mcpserver.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always          # run schema.sql on startup (idempotent); tolerates absent store
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# RAG / search configuration
rag:
  embedding:
    model-dir: ${user.dir}/models/nomic-embed-text-v1.5
    model-file: model_quantized.onnx
    dimensions: 768
    max-sequence-length: 512
  search:
    vector-top-k: 40
    lexical-top-k: 40
    rrf-k: 60               # Reciprocal Rank Fusion constant
    final-top-n: 10         # results after rerank
  ingestion:
    # Must fit the embedding model's 512-token window (incl. "passage: " prefix and
    # tokenizer variance) — larger chunks get silently truncated before embedding.
    target-chunk-tokens: 450
    chunk-overlap-tokens: 80
  web:
    searxng-url: http://127.0.0.1:8888
    page-count: 5
    chunk-per-query: 8
    page-fetch-timeout-seconds: 10
    max-content-chars: 20000

# Web UI Chat answer generation (com.mcpserver.services.CopilotChatService) — external
# Copilot backend; answers grounded with RAG retrieval. Web UI only: the MCP context
# path stays retrieval-only (DECISIONS.md 2026-07-25).
chat:
  copilot:
    timeout-seconds: 180        # overall per-turn budget (session + conversation + full answer)
    connect-timeout-seconds: 30
    mode: smart                 # conversation mode sent in the WebSocket send frame
    context-top-k: 6            # retrieved chunks injected as grounding per turn
    max-context-chars: 1500     # per-source body cap in the grounding prompt
    # Anonymous chat is gated server-side by Copilot (observed 2026-07-25: conversation
    # creation succeeds anonymously, the chat WebSocket handshake 401s). To activate answer
    # generation, copy credentials from a signed-in browser session on copilot.microsoft.com:
    #   access-token:  the accessToken query param of the wss://…/c/api/chat request
    #                  (DevTools → Network → WS → Request URL), or the Bearer token of any API call
    #   identity-type: the matching X-UserIdentityType query param (e.g. "msa"), if present
    #   cookies:       alternatively/additionally, the raw Cookie header value
    # Prefer environment variables over editing this file (never commit real tokens):
    #   CHAT_COPILOT_ACCESSTOKEN / CHAT_COPILOT_IDENTITYTYPE / CHAT_COPILOT_COOKIES
    access-token: ""
    identity-type: ""
    cookies: ""

# Confluence/Jira connectors (com.mcpserver.connectors)
connectors:
  poll-interval-ms: 300000   # 5 minutes — delta-poll cadence for every CONNECTED connection
  # Publicly reachable base URL Confluence/Jira Server-DC would POST webhooks to (e.g. behind a
  # reverse proxy). Blank (the default, since server.address is 127.0.0.1 — trusted network only)
  # means webhook registration is skipped and every connection relies on delta polling only.
  webhook-base-url: ""

logging:
  level:
    com.mcpserver: INFO
