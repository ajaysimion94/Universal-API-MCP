server:
  port: 8080
  address: 127.0.0.1   # trusted internal network only — no auth until Phase 6 (plan.md §1)

spring:
  application:
    name: mcp-server
  datasource:
    url: jdbc:sqlite:./data/mcpserver.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always          # run schema.sql on startup (idempotent); tolerates absent store
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# RAG / search configuration
rag:
  embedding:
    model-dir: ${user.dir}/models/nomic-embed-text-v1.5
    model-file: model_quantized.onnx
    dimensions: 768
    max-sequence-length: 512
  reranker:
    model-dir: ${user.dir}/models/ms-marco-MiniLM-L6-v2
    model-file: model.onnx
    max-sequence-length: 512
  search:
    vector-top-k: 40
    lexical-top-k: 40
    rrf-k: 60               # Reciprocal Rank Fusion constant
    final-top-n: 10         # results after rerank
    min-relevance-score: 0.015
  ingestion:
    # Must fit the embedding model's 512-token window (incl. "passage: " prefix and
    # tokenizer variance) — larger chunks get silently truncated before embedding.
    target-chunk-tokens: 450
    chunk-overlap-tokens: 80
  web:
    searxng-url: http://127.0.0.1:8888
    engines: bing,brave,duckduckgo,startpage,stackoverflow
    page-count: 5
    query-count: 4
    candidate-count: 24
    page-fetch-count: 10
    page-fetch-timeout-seconds: 8
    max-response-bytes: 2097152
    max-content-chars: 20000
    min-relevance-score: 0.20

# Feedback-driven adaptive ranking (com.mcpserver.learning).
# Capture and the feedback memory are on by default: capture is pure-write and happens off the
# request thread, and the memory does nothing at all until the user actually votes. The bandit is
# off by default because exploration is the only part that changes results without being asked —
# with it disabled, served ranking is bit-identical to a build without this subsystem.
learning:
  enabled: true
  settle-interval-ms: 30000
  reward-window-seconds: 120        # how long an impression collects implicit signals before settling
  impression-retention-days: 180    # prune only impressions that never received any feedback
  prune-interval-ms: 86400000       # daily
  bandit:
    enabled: false
    shadow-mode: false              # log the arm the policy would pick; keep serving baseline
    epsilon: 0.10
    alpha: 0.35
  memory:
    max-boost: 0.12                 # asymmetric on purpose: a wrong demotion hides evidence,
    max-demote: 0.06                # which is worse than a wrong promotion
    learning-rate: 0.34             # three consistent votes reach full strength; one is never decisive
    jaccard-threshold: 0.60
    cosine-threshold: 0.92
    half-life-days: 45
    max-entries: 2000

# Confluence/Jira connectors (com.mcpserver.connectors)
connectors:
  poll-interval-ms: 300000   # 5 minutes — delta-poll cadence for every CONNECTED connection
  poll-concurrency: 4        # independent sources fetch concurrently; one source never overlaps itself
  reconcile-interval-ms: 86400000 # daily full-ID inventory purges remote deletions/permission removals
  lazy-title-match-limit: 3  # bound remote body fetches triggered by one strong title/key search match
  # Publicly reachable base URL Confluence/Jira Server-DC would POST webhooks to (e.g. behind a
  # reverse proxy). Blank (the default, since server.address is 127.0.0.1 — trusted network only)
  # means webhook registration is skipped and every connection relies on delta polling only.
  webhook-base-url: ""

# Outbound HTTPS trust for internal APIs.
# Java normally uses its bundled CA store, not Windows Trusted Root Certification Authorities.
# On Windows the OS root store is added automatically. For a CA that is not installed there,
# set MCP_TLS_CA_CERTIFICATE_PATHS to one or more comma-separated PEM/DER certificate files.
# MCP_TLS_DISABLE_VERIFY=true is an emergency Postman-style bypass; never use it in production.
http:
  tls:
    use-windows-root-store: true
    ca-certificate-paths: ${MCP_TLS_CA_CERTIFICATE_PATHS:}
    disable-certificate-validation: ${MCP_TLS_DISABLE_VERIFY:false}

logging:
  level:
    com.mcpserver: INFO
