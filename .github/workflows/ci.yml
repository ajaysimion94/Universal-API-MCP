name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Backend tests and retrieval quality gate
        working-directory: mcp-server
        run: mvn -Dskip.frontend=true -Deval.run.id=ci-${{ github.run_id }} test
      - name: Upload golden-set report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: eval-runs/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp-server/webui/package-lock.json
      - working-directory: mcp-server/webui
        run: npm ci --include=dev
      - working-directory: mcp-server/webui
        run: npm run typecheck
