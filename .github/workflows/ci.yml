name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Backend tests and retrieval quality gate
        working-directory: mcp-server
        run: mvn -Deval.run.id=ci-${{ github.run_id }} test
      - name: Package browser-native UI and server
        working-directory: mcp-server
        run: mvn -Dskip.bundle=true -DskipTests package
      - name: Upload golden-set report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: eval-runs/
          if-no-files-found: error
